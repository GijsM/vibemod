name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 21 is the toolchain every module but `fabric` uses; `fabric` needs 25
      # (MC 26.x requires it) and the foojay resolver provisions that itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and self-test
        run: ./gradlew build --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paper/build/libs/VibeMod.jar
            fabric/build/libs/vibemod-fabric-*.jar
          generate_release_notes: true
