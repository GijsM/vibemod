name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # `build` also runs the five self-tests: they are plain main() classes
      # wired as JavaExec tasks and hooked into `check`. StoreSelfTest's
      # stored-corpus compile skips itself here (no server/ in a clean clone).
      - name: Build and self-test
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: VibeMod
          path: paper/build/libs/VibeMod.jar
