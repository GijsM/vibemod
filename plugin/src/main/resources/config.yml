# VibeMod configuration.
#
# Key resolution order for the OpenRouter API key (never hardcode a key anywhere):
#   1. openrouter.api-key below
#   2. environment variable OPENROUTER_API_KEY
#   3. file ~/.config/vibemine/openrouter.key
openrouter:
  # OpenRouter API key. Leave blank to fall back to the env var / key file below.
  api-key: ""            # or env OPENROUTER_API_KEY, or ~/.config/vibemine/openrouter.key
  # Model used to generate/edit/repair mods (OpenRouter model id).
  model: anthropic/claude-sonnet-5
  # How long to wait for a single LLM completion before giving up.
  timeout-seconds: 120
  # SSE streaming: live plan/file progress on the boss bar. false = single-shot requests.
  streaming: true
  # Completion-token cap per request. 0 (default) = no cap: the model's own ceiling applies.
  max-tokens: 0

generation:
  # How many auto-repair attempts to make when generated code fails to compile
  # before giving up and reporting failure to the player.
  max-retries: 3

watchdog:
  # Whether generated mods are time-boxed at all. Disable only for debugging.
  enabled: true
  # A single listener/task invocation slower than this (ms) trips the watchdog.
  single-invocation-ms: 250
  # Accumulated time (ms) a mod may spend per rolling 1-second window before
  # the watchdog trips and the mod is auto-disabled.
  per-second-budget-ms: 500

commands:
  # If true, DynamicCommands will try to register real top-level commands
  # (e.g. /boom) for mods that ask for one. If registration is unavailable
  # or fails, VibeMod falls back to "/vibe do <mod> <action>" automatically.
  allow-top-level: true

errors:
  # A mod that throws this many times within storm-window-seconds is treated
  # like a watchdog trip: auto-disabled and announced, instead of just being
  # marked degraded.
  storm-threshold: 10
  # Rolling window (seconds) the storm-threshold count is measured over.
  storm-window-seconds: 60
  # Maximum distinct (deduped by root-cause class + top stack frame) error
  # records kept per mod before the oldest is evicted.
  max-distinct: 25
  # Number of stack frames kept per recorded error (truncated for storage
  # and for the [fix] prompt sent to the model).
  stack-frames: 10

debug:
  # Default state of the per-mod debug echo (ctx.log() + caught exceptions
  # streamed to ops) for mods that haven't had it explicitly toggled.
  default-echo: false
