# Shared dependency versions. paper-api brings adventure-api and gson along as
# transitives; the versions below are pinned to exactly what paper-api 1.21.8
# resolves so `core` (which must not depend on paper-api, ARCHITECTURE-V2 §1)
# compiles against the same bytes the server provides at runtime.
paperApiVersion=1.21.8-R0.1-SNAPSHOT
adventureVersion=4.24.0
gsonVersion=2.11.0
# ECJ: the fallback compiler backend (ARCHITECTURE-V2 7.3). 3.42.0 is the
# newest on Maven Central; the doc guessed >=3.43, which does not exist yet.
ecjVersion=3.42.0

org.gradle.parallel=true
org.gradle.caching=true

# run-paper targets (ARCHITECTURE-V2 9, Phase C acceptance): the 1.20.6 floor,
# the dialog baseline the plugin was built on, and the newest supported line.
paperRunVersionLegacy=1.20.6
paperRunVersionModern=1.21.8
paperRunVersionNext=26.2
