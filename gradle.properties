# Shared dependency versions. paper-api brings adventure-api and gson along as
# transitives; the versions below are pinned to exactly what paper-api 1.21.8
# resolves so `core` (which must not depend on paper-api, ARCHITECTURE-V2 §1)
# compiles against the same bytes the server provides at runtime.
paperApiVersion=1.21.8-R0.1-SNAPSHOT
adventureVersion=4.24.0
gsonVersion=2.11.0
# ECJ: the fallback compiler backend (ARCHITECTURE-V2 7.3). 3.42.0 is the
# newest on Maven Central; the doc guessed >=3.43, which does not exist yet.
ecjVersion=3.42.0

org.gradle.parallel=true
org.gradle.caching=true

# run-paper targets (ARCHITECTURE-V2 9, Phase C acceptance): the 1.20.6 floor,
# the dialog baseline the plugin was built on, and the newest supported line.
paperRunVersionLegacy=1.20.6
paperRunVersionModern=1.21.8
paperRunVersionNext=26.2

# ---------------------------------------------------------------------------
# Fabric (ARCHITECTURE-V2 §9, Phase D). MC 26.1+ only: 26.x is unobfuscated, so
# Loom runs under its no-remap plugin id (`net.fabricmc.fabric-loom`) with no
# `mappings` line at all and a plain `jar` task instead of `remapJar`.
# 26.2 is the target: it is what adventure-platform-mod 7.x publishes for.
# ---------------------------------------------------------------------------
loomVersion=1.17.19
minecraftVersion=26.2
fabricLoaderVersion=0.19.3
fabricApiVersion=0.158.0+26.2
# 26.x requires Java 25 (fabric.mod.json "java": ">=25"), so this one module
# leaves the repo-wide Java 21 toolchain behind.
fabricJavaVersion=25

# ---------------------------------------------------------------------------
# NeoForge (ARCHITECTURE-V2 §9, Phase E). Same MC 26.2 target as Fabric, same
# Java 25. NeoForge's version's first two components ARE the Minecraft version
# under the 26.x scheme (26.2.0.x = MC 26.2), so the two stay in lockstep.
# ---------------------------------------------------------------------------
moddevgradleVersion=2.0.144
neoforgeVersion=26.2.0.67
# Mixin's annotation processor is not on NeoForge's compile classpath by default
# under MDG; the one mixin this module needs (§8.5 dialog responses) is declared
# in neoforge.mods.toml and applied by NeoForge's own mixin service.
neoforgeJavaVersion=25
