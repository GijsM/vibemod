name: VibeMod
version: 3.0.0
main: com.gijsm.vibemod.VibeMod
# The floor is Paper 1.20.6 (ARCHITECTURE-V2 §0#5, §6.3). Everything newer than
# that which VibeMod touches is capability-gated at runtime, never assumed —
# the native dialog UI included, which is why 1.20.6 falls back to chat.
api-version: '1.20'
author: gijsm
description: "Vibe-code gameplay mods from in-game prompts"

commands:
  vibe:
    description: "Vibe-code gameplay mods from in-game prompts"
    usage: /vibe help

permissions:
  vibe.use:
    description: "Use read-only /vibe subcommands (list, source, help)"
    default: op
  vibe.admin:
    description: "Full control of VibeMod: make, edit, enable/disable, export, panic, etc."
    default: op
