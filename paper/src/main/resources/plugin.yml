name: VibeMod
version: 2.0.0
main: com.gijsm.vibemod.VibeMod
# INVARIANT — do not raise this to declare a minimum supported version.
#
# `api-version` is NOT "the oldest API I need". It tells CraftBukkit which era's
# semantics this plugin's code was written against, so it knows whether to run
# legacy DATA CONVERSION (materials, the Commodore bytecode rewriter) before
# handing the plugin its classes. It says nothing about which API exists.
#
# Declaring a value ABOVE the running server makes Paper refuse the plugin
# outright, before any VibeMod code runs:
#   org.bukkit.plugin.InvalidPluginException: Unsupported API version <value>
# That refusal, not any capability, is the entire reason VibeMod does not load
# on Paper 1.19.4 and below. This has been mistaken for a capability once
# already, so: raising this number does not "require" a newer server, it just
# stops older ones from loading a plugin that would otherwise have worked.
#
# Lowering it is not free either. Once it is below the running server,
# Commodore must rewrite for real, and Paper 1.20 bundles ASM 9.4, which cannot
# read Java 21 bytecode — so a lower floor needs a Java 17 retarget first.
# (ARCHITECTURE-V2 §0#5, §6.3, §10.6.)
#
# Measured floor: Paper 1.20. Everything newer than that which VibeMod touches
# is capability-gated at runtime, never assumed — the native dialog UI
# included, which is why 1.20–1.21.6 falls back to the chat UI.
api-version: '1.20'
# Folia support. Deliberately the LAST thing added, because on its own it is a
# regression: with this flag and nothing else, VibeMod enables cleanly on Folia
# 26.2 (dialogs and command map both probe true) and then dies during
# restore-on-boot, in applyStoredVersion, on its OWN async compile hop —
# UnsupportedOperationException from CraftScheduler.handle, because
# Bukkit.getScheduler() does not exist on Folia. The flag alone converts an
# honest refusal to load into a boot-time crash that disables the plugin.
#
# What makes it true rather than merely permitted: FoliaTickScheduler (global
# region + async schedulers, selected by PaperPlatformInfo#isRegionised), the
# command-dispatch hop that keeps /vibe panic working when a PLAYER types it,
# and the probe-predicated threading rule that stops telling generated mods
# they are on a single thread.
#
# What it does NOT claim: per-region parallelism. Every mod callback this host
# schedules is pinned to the global region thread, which forgoes the main reason
# to run Folia. Event handlers still arrive on region threads and remain the
# unsound edge — see ARCHITECTURE-V2 and the release notes.
folia-supported: true
author: gijsm
description: "Vibe-code gameplay mods from in-game prompts"

commands:
  vibe:
    description: "Vibe-code gameplay mods from in-game prompts"
    usage: /vibe help

permissions:
  vibe.use:
    description: "Use read-only /vibe subcommands (list, source, help)"
    default: op
  vibe.admin:
    description: "Full control of VibeMod: make, edit, enable/disable, export, panic, etc."
    default: op
